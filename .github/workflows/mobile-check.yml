name: Mobile validation
on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-check.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-check.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx expo install --check
      - run: npm run check
      - run: npx expo export --platform ios --output-dir /tmp/fairways-ios-bundle
